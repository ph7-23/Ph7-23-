<html lang="pt-BR">
<head>

<title>PUNHETA SEMANAL</title>
<style>

:root{

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a0c09;color:#dfe2d0}
#wrap{min-height:100vh;background-color:#0a0c09;

#app{max-width:700px;margin:0 auto;padding:16px 14px 70px}
h1{font-family:Bitter,Georgia,serif;font-weight:900;font-size:clamp(26px,8vw,44px);line-height:.95;letter-spacing:-1px;margin:0 0 4px;color:#cdbd3f;text-shadow:0 0 18px rgba(205,189,63,.22),1px 1px 0 #000;filter:blur(.25px)}
.sub{color:#8d947e;font-size:12px;margin-bottom:14px}
.panel{border:2px solid #3d4530;background:linear-gradient(180deg,#141810,#0e1109);padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat{border:1px solid #2b3123;padding:6px;background:#0c0f09}
.stat b{display:block;font-size:10px;color:#8d947e;letter-spacing:.5px}
.stat i{font-style:normal;font-size:19px;font-weight:700;color:#dfe2d0}

.barwrap{height:26px;border:2px solid #3d4530;background:#080a06;margin:8px 0 12px;overflow:hidden}
.bar{height:100%;transition:width 180ms ease,background 180ms ease;width:0}
.bar.striped{width:100%;background:repeating-linear-gradient(45deg,#22261b 0 10px,#151810 10px 20px)}
.c-red{background:#c04c3c}.c-muc{background:#cdbd3f}.c-gre{background:#a9c34b}
.c-pur{background:#b46cf5;box-shadow:0 0 18px #b46cf5}
button{font-family:inherit;font-size:12.5px;font-weight:700;background:#1b2013;color:#dfe2d0;border:2px solid #3d4530;padding:11px 13px;min-height:46px;cursor:pointer;transition:all 160ms;letter-spacing:.5px;text-transform:uppercase}
button:hover:not(:disabled){background:#252b19;border-color:#a9c34b;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:#cdbd3f;color:#0a0c09;border-color:#e0d45c}
button.primary:hover:not(:disabled){background:#e2d460;color:#000}
button.ghost{background:transparent}
.gate{border:2px dashed #cdbd3f;padding:12px;background:#12140c;margin-bottom:12px}
.gate p{margin:0 0 10px;font-size:12.5px;color:#c8cba9}
.row{display:flex;gap:8px}
input[type=number]{flex:1;background:#080a06;border:2px solid #3d4530;color:#dfe2d0;font-family:inherit;font-size:18px;padding:9px;min-height:46px;width:100%}

.lvhead .cnt{font-size:11px;color:#cdbd3f;margin-left:auto}
.lvhead .mult{font-size:10.5px;color:#8d947e}
.locked .lvhead h2{color:#6b725c}
.lvt{margin:0 0 8px;font-size:10.5px;color:#6d7461;text-transform:uppercase;letter-spacing:.5px}
.lockline{margin:0 0 10px;font-size:12px;color:#8d947e;border-left:3px solid #3d4530;padding-left:9px}
.act{border:1px solid #2b3123;border-left:4px solid #3d4530;background:#11140e;padding:10px;margin-bottom:8px;display:grid;gap:6px}
.act .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.act h3{margin:0;font-size:13.5px;letter-spacing:.3px}
.pts{font-size:11.5px;color:#cdbd3f;white-space:nowrap;font-weight:700}
.act p{margin:0;font-size:12px;color:#a9b098;line-height:1.45}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;color:#8d947e}
.act button{min-height:42px;font-size:11.5px;padding:8px}
.card{border:2px solid #cdbd3f;background:#151709;padding:12px;margin-bottom:10px;box-shadow:inset 0 0 0 1px #000}
.card.ach{border-color:#a9c34b;background:#121a0b}
.card .ttl{font-family:Bitter,serif;font-weight:900;color:#cdbd3f;font-size:15px;letter-spacing:.5px;margin-bottom:6px;line-height:1.1}
.card.ach .ttl{color:#a9c34b}
.card p{margin:0 0 10px;font-size:12.5px;line-height:1.45}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ach{border:1px solid #2b3123;padding:9px;background:#11140e;font-size:11px;line-height:1.4;color:#a9b098}
.ach.sealed{color:#6f765f;border-style:dashed;background:#0d100a}
.ach b{display:block;font-size:11.5px;margin-bottom:3px;color:#8d947e;letter-spacing:.5px}

.ach.on b{color:#a9c34b}
.ach time{display:block;font-size:9.5px;color:#7c8368;margin-top:5px}
.lost{font-size:11.5px;color:#8d947e;border:1px solid #2b3123;padding:8px;margin:10px 0}
.big{width:100%;min-height:56px;font-size:14px}
.hist{border-top:1px dashed #3d4530;margin-top:20px;padding-top:10px}
.hist h4{margin:0 0 6px;font-size:10.5px;color:#8d947e;letter-spacing:1px;text-transform:uppercase}

.hist li b{color:#a9b098;font-weight:400}
.hist ul{margin:0;padding:0}
.vcard{margin-top:10px}
.tiny{font-size:10px;color:#6d7461;margin-top:14px;text-align:center;line-height:1.6}
</style>
</head>

function fresh(){return{week:dISO(mondayOf()),goal:null,goalAt:null,pts:0,counts:{},clicks:[],lvlDays:{},dayStreak:0,lastDay:null,maxLevel:0,transg:0,achieved:false,ot:false,ach:{},lost:0,life:0,total:0,achStreak:0,pool:[]};}
let Q=[],TOASTS=[],tab='acoes',resetStep=0,vcard='';
function load(){try{const r=localStorage.getItem(KEY);if(!r)return fresh();return Object.assign(fresh(),JSON.parse(r));}catch(e){return fresh();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=load();
function unlock(s,id){if(s.ach[id])return false;s.ach[id]=new Date().toISOString();save();Q.push(id);return true;}
function rollover(){
const cur=dISO(mondayOf());
if(state.week===cur)return;
const old=state.week;
const diff=Math.max(1,Math.round((mondayOf().getTime()-mondayOf(new Date(old+'T00:00:00')).getTime())/6048e5));
if(!state.achieved)state.lost+=diff;
const wc=state.clicks.filter(c=>c.d>=old).length;
if(wc===0)unlock(state,'vazio');
if(state.achieved){state.achStreak++;if(state.achStreak>=3)unlock(state,'tresSemanas');}else state.achStreak=0;
Object.assign(state,{week:cur,goal:null,goalAt:null,pts:0,counts:{},lvlDays:{},dayStreak:0,lastDay:null,maxLevel:0,transg:0,achieved:false,ot:false,pool:[]});
save();}
rollover();
if(state.lastDay&&state.lastDay!==dISO()&&state.lastDay!==yest())state.dayStreak=0;
function doneCount(lv){let c=0;for(const a of A)if(a.lv===lv&&state.counts[a.id])c++;return c;}
function unlocked(){let u=1;for(let l=1;l<=5;l++)if(doneCount(l)>=4)u=l+1;return u;}
function weekClicks(){return state.clicks.filter(c=>c.d>=state.week).length;}
function snap(){return{falta:Math.max(0,(state.goal||0)-state.pts),pts:state.pts,dias:daysLeft(),streak:state.dayStreak,weekClicks:weekClicks(),nivel:unlocked(),extra:state.pts-(state.goal||0)};}
function checkAch(h){
const s=state;
if(s.total===1)unlock(s,'primeiro');
if(s.achieved)unlock(s,'primeiraMeta');
if(s.dayStreak>=3)unlock(s,'streak3');
if(s.dayStreak>=7)unlock(s,'streak7');
for(let l=2;l<=6;l++)if(s.maxLevel>=l)unlock(s,'lv'+l);
if(s.life>=1000)unlock(s,'mil');
if(s.life>=5000)unlock(s,'cinco');
if(s.transg>=3)unlock(s,'transg3');
if(doneCount(1)>=6)unlock(s,'l1full');
if(s.achieved&&s.pts>=(s.goal||0)+100)unlock(s,'sobra');
if(h<8&&h>=0&&s.maxLevel>=4&&s.counts[lastLv4])unlock(s,'cedo');
if(h>=23)unlock(s,'tarde');
}
let lastLv4=null;
function click(id){
const s=state,a=byId[id],u=unlocked();
if(!s.goal||a.lv>u)return;
const h=new Date().getHours(),today=dISO();
if(s.lastDay!==today){s.dayStreak=(s.lastDay===yest())?s.dayStreak+1:1;s.lastDay=today;}
const ld=s.lvlDays[a.lv]||{n:0,last:null};
if(ld.last===yest())ld.n++;else if(ld.last!==today)ld.n=1;
ld.last=today;s.lvlDays[a.lv]=ld;
let p=base(a)+Math.min(ld.n,5)*5;
if(a.lv>s.maxLevel){s.transg++;p+=20;TOASTS.push({t:'VOCÊ SUBIU DE NÍVEL',b:'Nível '+a.lv+', '+LEVELS[a.lv].name+'. Ninguém esperava, nem você. +20 de transgressão e o nível anterior fica pra trás.'});}
s.maxLevel=Math.max(s.maxLevel,a.lv);
s.pts+=p;s.life+=p;s.total++;
s.counts[id]=(s.counts[id]||0)+1;
s.clicks.push({d:today,h:pad(new Date().getHours())+':'+pad(new Date().getMinutes()),n:a.name,p:p});
if(s.clicks.length>300)s.clicks.shift();
if(h<8&&a.lv===4)unlock(s,'cedo');
if(h>=23)unlock(s,'tarde');
checkAch(h);
if(!s.achieved&&s.pts>=s.goal){s.achieved=true;s.ot=true;TOASTS.push({t:'PARABÉNS, VOCÊ CONSEGUIU O MÍNIMO',b:s.pts+' pontos numa meta de '+s.goal+'. O mínimo de alguém que não tem mais nada acontecendo. Overtime liberado, e não é elogio.'});}
save();render();
}
function pick(){
const s=state,sn=snap();let cands;
if(s.ot)cands=POOL.filter(p=>p.t==='ot');
else{const pct=s.goal?Math.min(100,s.pts/s.goal*100):0;const tier=pct<=40?'low':pct<=80?'mid':'high';
cands=POOL.filter(p=>p.t===tier&&(!p.c||p.c(sn)));}
if(!cands.length)cands=POOL.filter(p=>p.t==='low');
let av=cands.filter(p=>s.pool.indexOf(p.id)<0);
if(!av.length){s.pool=s.pool.filter(i=>!cands.some(c=>c.id===i));av=cands;}
const p=av[Math.floor(Math.random()*av.length)];
s.pool.push(p.id);save();
return p.f(sn);}
function render(){
const s=state,u=unlocked();
const pct=s.goal?Math.min(100,s.pts/s.goal*100):0;
let cards='';
TOASTS.forEach(c=>{cards+='<div class="card"><div class="ttl">'+c.t+'</div><p>'+c.b+'</p><button>ACEITAR CALADO</button></div>';});
TOASTS=[];
Q.forEach(id=>{const a=ACHS.find(x=>x.id===id);if(!a)return;cards+='<div class="card ach"><div class="ttl">CONQUISTA: '+a.name+'</div><p>'+a.desc+'</p><button>ACEITAR CALADO</button></div>';});
Q=[];
$('#cards').innerHTML=cards;
$('#cards').querySelectorAll('button').forEach(b=>b.onclick=()=>b.parentNode.remove());
$('#gate').innerHTML=s.goal
?'<div class="selo">META FECHADA · '+fmt(s.goalAt)+' · '+s.goal+' PONTOS<br><span>pediu isso, agora aguenta</span></div>'
:'<div class="gate"><p>Definir a meta é a parte fácil, e você já tá demorando. Escolhe um número de 100 a 1000 e fecha. Depois não tem ajuste, não tem segunda chance, não tem desculpa.</p><div class="row"><input id="gin" type="number" min="100" max="1000" value="300" aria-label="meta semanal em pontos"><button class="primary" id="gbtn">FECHAR A META</button></div></div>';
const gb=$('#gbtn');
if(gb)gb.onclick=()=>{let v=parseInt($('#gin').value,10);if(isNaN(v))v=300;v=Math.max(100,Math.min(1000,v));s.goal=v;s.goalAt=new Date().toISOString();save();render();};
const S=[['META',s.goal||'--','a que você mesmo pediu'],['PONTOS','<span aria-live="polite">'+s.pts+'</span>','contando migalha'],['%',Math.round(pct)+'%','do combinado'],['DIAS',daysLeft(),'e você parado'],['STREAK',s.dayStreak,'dias seguidos, olhe lá'],['NÍVEL',u+'/6','até onde aguentou']];
$('#panel').innerHTML=S.map(x=>'<div class="stat"><b>'+x[0]+'</b><i>'+x[1]+'</i><span class="m">'+x[2]+'</span></div>').join('');
const bar=$('#bar');
if(!s.goal){bar.className='bar striped';bar.style.width='100%';}
else{bar.className='bar '+(pct<=33?'c-red':pct<=66?'c-muc':pct<100?'c-gre':'c-pur');bar.style.width=pct+'%';}
$('#t1').classList.toggle('on',tab==='acoes');
$('#t2').classList.toggle('on',tab==='verg');
$('#t3').classList.toggle('on',tab==='conq');
let v='';
if(tab==='acoes'){
 for(let lv=1;lv<=6;lv++){
  const d=doneCount(lv),locked=lv>u;
  v+='<section class="'+(locked?'locked':'')+'"><div class="lvhead"><h2>'+lv+'. '+LEVELS[lv].name+(locked?' · CADEADO':'')+'</h2><span class="mult">'+LEVELS[lv].mult+'x</span><span class="cnt">'+d+'/6</span></div><p class="lvt">'+LEVELS[lv].tag+'</p>';
  if(locked){v+='<p class="lockline">Faltam '+Math.max(0,4-doneCount(lv-1))+' ações do nível '+(lv-1)+'. '+LOCK[lv]+'</p>';}
  else{
   v+=A.filter(a=>a.lv===lv).map(a=>{const c=s.counts[a.id]||0;
    return '<div class="act"><div class="top"><h3>'+a.name+'</h3><span class="pts">'+base(a)+' pts</span></div><p>'+a.desc+'</p><div class="meta"><span>cumprida '+c+'x</span><button data-a="'+a.id+'"'+(!s.goal?' disabled':'')+'>+ CUMPRI</button></div></div>';}).join('');
  }
  v+='</section>';
 }
}
if(tab==='verg'){
 v+='<button class="primary big" id="verg">PEDIR VERGONHA</button><div class="vcard" id="vcard">'+vcard+'</div>';
}
if(tab==='conq'){
 const got=Object.keys(s.ach).length;
 v+='<p class="lvt">'+got+'/18 reveladas · nenhuma anunciada antes da hora</p><div class="achs">';
 v+=ACHS.map(a=>{const g=s.ach[a.id];
  return g?'<div class="ach on"><b>'+a.name+'</b>'+a.desc+'<time>'+fmt(g)+'</time></div>':'<div class="ach sealed"><b>???</b>'+a.hint+'</div>';}).join('');
 v+='</div><p class="lost">'+s.lost+' semanas fechadas sem bater a meta. Esse número só sobe.</p>';
}
$('#view').innerHTML=v;
const vb=$('#verg');
if(vb)vb.onclick=()=>{vcard='<div class="card"><div class="ttl">VERGONHA</div><p>'+pick()+'</p><button id="acc">ACEITAR CALADO</button></div>';$('#vcard').innerHTML=vcard;$('#acc').onclick=()=>{vcard='';$('#vcard').innerHTML='';};};
$('#view').querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>click(b.dataset.a));
const h=$('#hist'),last=s.clicks.slice(-10).reverse();
h.innerHTML=last.length?last.map(c=>'<li><b>'+c.n+'</b><span>'+c.h+' · +'+c.p+'</span></li>').join(''):'<li><b>nada registrado. como sempre.</b></li>';
$('#resetbox').innerHTML=resetStep===0
?'<button class="ghost" id="rst" style="margin-top:10px;width:100%">ZERAR SEMANA</button>'
:'<div class="card" style="margin-top:10px"><p>tem certeza mesmo? o estrago já foi feito, os pontos já foram. A meta não volta e as conquistas ficam.</p><div class="row"><button class="primary" id="rty">ZEREI, SIM</button><button id="rtn">DEIXA</button></div></div>';
if($('#rst'))$('#rst').onclick=()=>{resetStep=1;render();};
if($('#rtn'))$('#rtn').onclick=()=>{resetStep=0;render();};
if($('#rty'))$('#rty').onclick=()=>{resetStep=0;Object.assign(state,{pts:0,counts:{},lvlDays:{},dayStreak:0,lastDay:null,maxLevel:0,transg:0,achieved:false,ot:false,pool:[]});vcard='';save();render();};
}
$('#t1').onclick=()=>{tab='acoes';render();};
$('#t2').onclick=()=>{tab='verg';render();};
$('#t3').onclick=()=>{tab='conq';render();};
render();
})();
</script>
</body>
